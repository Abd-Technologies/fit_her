name: fitness_zone_2
description: A new Flutter project.
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 12.0.0+22

environment:
  sdk: '>=3.0.5 <4.0.0'

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter


  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.2
  google_fonts: ^6.2.1

  # Firebase (kept in dependencies so the native plugins are always registered)
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  firebase_messaging: ^16.7.0
  cloud_firestore: ^6.10.0

  # Moved from dev_dependencies: these are used by the app at runtime
  flutter_screenutil: ^5.4.0
  get: ^4.6.1
  fluttertoast: ^8.2.2
  permission_handler: ^11.3.1
  syncfusion_flutter_gauges: ^27.1.56
  syncfusion_flutter_sliders: ^27.1.56
  shared_preferences: ^2.5.5
  intl_phone_field: ^3.1.0
  image_picker: ^1.0.7
  connectivity_plus: ^6.0.5
  flutter_image_compress: ^2.3.0
  uuid: ^4.1.0
  intl:
  pdf: ^3.11.3
  share_plus: ^7.2.1
  device_info_plus: ^10.1.2
  carousel_slider: ^5.0.0
  url_launcher: ^6.2.6
  # App update popup (see helper/app_update_checker.dart)
  package_info_plus: ^9.0.1
  in_app_update: ^4.2.3
  flutter_local_notifications: ^18.0.1
  mixpanel_flutter: ^2.3.0
  custom_rating_bar: ^3.0.0
  googleapis_auth: ^1.6.0
  file_picker: ^9.0.2
  wakelock_plus: ^1.1.4
  webview_flutter: ^4.5.0
  flutter_dotenv: ^5.1.0
  flutter_animate: ^4.5.2
  flutter_svg: ^2.0.10+1
  percent_indicator: ^4.2.3
  syncfusion_flutter_charts: ^27.1.51
  syncfusion_flutter_pdfviewer: ^27.1.51
  open_filex: ^4.7.0
  app_links: ^6.3.2
  # Reads the rep's trial invite from the Play Store install referrer,
  # so a woman who installs from the invite link doesn't lose it.
  play_install_referrer: ^0.5.0
  pinput: ^5.0.1
  socket_io_client: ^3.1.2
  flutter_inappwebview: ^6.1.5  #  uni_links: ^0.5.1
  youtube_player_flutter: ^9.1.2
  youtube_player_iframe: ^5.2.1
  country_picker: ^2.0.26
  flutter_timezone: ^3.0.1
  # Phase F.3 — IANA zone database. flutter_timezone above only returns
  # the device's current zone *name*; this package provides the actual
  # offset/DST math via tz.getLocation + tz.TZDateTime. Initialised in
  # main.dart with tz.initializeTimeZones() before runApp.
  timezone: ^0.9.4
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^7.0.1
  dart_jsonwebtoken:
  crypto:
  cached_network_image: ^3.2.3
  sentry_flutter: ^9.30.1
  # Zindigi mini-app integration — AES-256/CBC/PKCS7 payload
  # encrypt/decrypt, per "Encryption And WebView JavaScript Interface
  # Documentation". See lib/utils/zindigi_crypto.dart.
  encrypt: ^5.0.3

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^2.0.0

flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/icons/
    - assets/profileImage/
    - assets/svg/
    - assets/
    - .env

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  fonts:
     - family: Poppins
       fonts:
         - asset: assets/fonts/Poppins-Regular.ttf
           weight: 400
         - asset: assets/fonts/Poppins-Medium.ttf
           weight: 500
         - asset: assets/fonts/Poppins-SemiBold.ttf
           weight: 600
         # Oct 2026: Bold and ExtraBold added. ~930 texts ask for w700/w800
         # (headlines, prices, big numbers) and showed as SemiBold without
         # them. Same static files Google Fonts serves (OFL licence).
         - asset: assets/fonts/Poppins-Bold.ttf
           weight: 700
         - asset: assets/fonts/Poppins-ExtraBold.ttf
           weight: 800
     # Bundled locally instead of fetched at runtime by the google_fonts
     # package. Runtime fetching caused a visible font flash (FOUT) on the
     # welcome / login / diet screens: the text painted in the system
     # fallback first, then snapped to the real face once the download (or
     # the async cache read) finished. Bundled fonts load from the asset
     # bundle before the first frame, so there is no flash and no network
     # dependency. Files are the exact static instances Google's CDN serves,
     # so rendering is unchanged.
     - family: DMSerifDisplay
       fonts:
         - asset: assets/fonts/DMSerifDisplay-Regular.ttf
           weight: 400
     - family: Fraunces
       fonts:
         - asset: assets/fonts/Fraunces-Light.ttf
           weight: 300


#     - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
